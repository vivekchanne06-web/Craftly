apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-deployment
  labels:
    name:  ai-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app:  ai-server
    spec:
      containers:
      - image:  707582905055.dkr.ecr.ap-south-1.amazonaws.com/ai-orchestration
        name:  ai-server
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
          - name: MISTRALAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-secret
                key: MISTRALAI_API_KEY

          - name: CORS_ORIGIN
            value: "https://craftly.work.gd"

          - name: NODE_ENV
            value: "production"

        livenessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10   
        ports:
        - containerPort:  3000
          name:  ai-server-port
        